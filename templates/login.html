<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 450px; width: 100%; }
        .card {
            background: white;
            border-radius: 30px;
            padding: 45px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 35px; }
        input {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .demo-info {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 School MS</h1>
            <div class="subtitle">School Management System</div>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Login</button>
            <div id="message" class="message"></div>
            <div class="demo-info">
                <strong>Demo:</strong> admin@school.com / admin123
            </div>
        </div>
    </div>
    <script>
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('message');
            if (!email || !password) {
                msg.textContent = 'Please enter email and password';
                msg.className = 'message error';
                return;
            }
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password: password })
                });
                const result = await res.json();
                if (result.success) {
                    msg.textContent = 'Login successful! Redirecting...';
                    msg.className = 'message success';
                    setTimeout(() => { window.location.href = result.role === 'admin' ? '/admin' : '/teacher'; }, 1000);
                } else {
                    msg.textContent = result.message;
                    msg.className = 'message error';
                }
            } catch (error) {
                msg.textContent = 'Error connecting to server';
                msg.className = 'message error';
            }
        }
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
